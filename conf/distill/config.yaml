defaults:
  - _self_
  - task: g1_walk_height/mujoco
  - optional workflow: null

algo:
  algo_log_name: distill
  seed: 1
  num_envs: 4096
  max_agent_steps: 100000000
  gradient_length: 15
  learning_rate: 3.0e-4
  max_grad_norm: 1.0
  loss_type: mse
  aux_loss_coef: 0.0
  role_loss_coef: 0.0
  role_expert_targets: {}
  command_intent_loss_coef: 0.0
  command_intent_expert_targets:
    active: 0
    inactive: 1
  expert_behavior_loss_source: auto
  save_interval_steps: 10000000
  log_interval_steps: 32768
  load_run: "-1"
  checkpoint: -1

teacher:
  algo_family: sac
  algo_type: sac
  algo_log_name: fast_sac
  task: sac/g1_walk_height/mujoco
  task_name: G1WalkHeight
  checkpoint_path: null
  load_run: "-1"
  checkpoint: -1
  obs_dim: 99
  action_dim: 29
  actor_hidden_dim: 512
  use_layer_norm: true
  obs_normalization: true

student:
  model_type: mlp
  obs_dim: 99
  action_dim: 29
  hidden_dims: [256, 256, 256]
  num_experts: 3
  expert_hidden_dims: [256, 256, 256]
  router_hidden_dims: []
  routing_mode: soft
  router_temperature: 1.0
  activation: elu
  squash_action: true

training:
  task_name: G1WalkHeight
  device: null
  logger: tensorboard
  sim_backend: mujoco
  play_only: false
  play_render_mode: none
  play_checkpoint_path: null
  play_env_num: 16
  play_steps: 200
  dry_run: false
  dry_run_batch_size: 8
  dry_run_updates: 1
  dry_run_checkpoint: null
  offline_dataset_path: null
  offline_batch_size: 256
  offline_max_updates: 1
  offline_init_checkpoint: null
  recovery_integration: false
  offline_resume_optimizer: true
  offline_checkpoint: null
  offline_repeat_dataset: false
  offline_shuffle: false
  offline_balance_key: none
  offline_balanced_labels: []
  offline_balance_quotas: {}
  offline_min_balanced_replay_passes: 0
  offline_min_balanced_replay_labels: []
  online_dagger: false
  workflow:
    enabled: false
    mode: auto
    execution_mode: legacy
    run_dir: null
    parent_run_dir: null
    artifact_dir: logs/distill_role_artifacts
    schema_version: 1
    adopt_legacy_artifacts: false
    roles: []
    scenarios: []
    collect_num_samples: 262144
    collect_num_envs: 64
    bootstrap_batch_size: 512
    bootstrap_updates: 20000
    dagger_iterations: 8
    dagger_samples_per_role: 65536
    dagger_batch_size: 512
    dagger_updates_per_iteration: 128
    dagger_balance_key: role
    dagger_balanced_labels: []
    transition_pre_switch_steps: 8
    transition_nominal_settle_steps: 0
    transition_min_post_switch_steps: 20
    dagger_min_transition_replay_passes: 8
    dagger_min_transition_replay_labels: [walk_to_stop]
    transition_walk_command: [0.4, 0.0, 0.0]
    transition_walk_commands: []
    transition_walk_target_height: null
    transition_post_switch_target_heights: []
    transition_max_env_steps: null
  dagger_iterations: 8
  dagger_samples_per_iteration: 65536
  dagger_batch_size: 512
  dagger_updates_per_iteration: 128
  dagger_role_label: null
  dagger_checkpoint: null
  dagger_shuffle: true
  dagger_balance_key: none
  dagger_balanced_labels: []
  formal_run: false
  formal_run_name: null
  formal_run_dir: null
  multitask_dataset_path: null
  multitask_sources: []
  multitask_expected_student_obs_dim: null
  multitask_expected_teacher_obs_dim: null
  multitask_expected_teacher_action_dim: null
  collect_dataset_path: null
  collect_num_samples: 1024
  collect_num_envs: 1
  collect_action_mode: zero
  collect_action_seed: null
  collect_rollout_checkpoint_path: null
  collect_teacher_obs_key: obs
  collect_teacher_projection: identity
  collect_student_projection: identity
  collect_student_drop_index: null
  collect_command_sample_filter: none
  collect_command_info_key: commands
  collect_target_height_info_key: null
  collect_command_xy_threshold: 0.05
  collect_command_yaw_threshold: 0.05
  collect_max_env_steps: null
  collect_role_label: null
  log_root: null
  log_dir: null

interactive:
  action_mode: zero
  policy_obs_mode: auto
  show_target_bodies: false
  show_reward_debug: false
  target_show_axes: false
  target_body_names: ""
  target_max_bodies: 0
  target_marker_radius: 0.02
  target_axis_length: 0.08
  target_marker_alpha: 0.75
  reward_debug_show_velocity: false
  reward_debug_lin_vel_scale: 0.08
  reward_debug_ang_vel_scale: 0.05
  reward_debug_show_connectors: false
  reward_debug_show_global_anchor: false
  camera_follow_body: true
  camera_focus_body_name: ""
  camera_height_offset: 0.15
  camera_distance: null
  camera_elevation: null
  camera_azimuth: null
  use_env_visual_model: true
  speed: 1.0
  start_paused: false
  keyboard: false
  keyboard_step_lin: 0.1
  keyboard_step_ang: 0.2
  require_keyboard_command_obs: true
  distill_command_routing: auto
  distill_command_xy_threshold: 0.05
  distill_command_yaw_threshold: 0.05
  distill_command_routing_bias: 10.0

env: {}
reward: {}

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
  job_logging:
    root:
      handlers: [console]
