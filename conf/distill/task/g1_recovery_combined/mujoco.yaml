# @package _global_
training:
  task_name: G1RecoveryCombined
  sim_backend: mujoco
  collect_command_sample_filter: inactive
  collect_target_height_info_key: height_commands
env:
  max_episode_seconds: 15.0
  recovery_reset_supine: false
  recovery_routing:
    enter_height: 0.40
    enter_tilt_deg: 60.0
    nominal_settle_steps: 100
  commands:
    small_xy_threshold: 0.0
    height_range: [0.754, 0.754]
    default_height: 0.754
    random_height_during_walking: false
    observe_height_command: true
  control_config:
    action_scale: 1.0
  gait_phase_init_mode: "offset_phase"
  reset_base_qvel_limit: 0.5
  curriculum:
    enabled: false
    initial_scale: 0.5
    min_scale: 0.5
    max_scale: 1.0
    level_down_threshold: 150.0
    level_up_threshold: 750.0
    degree: 0.001
  noise_config:
    level: 1.0
    scale_gyro: 0.0
    scale_gravity: 0.0
    scale_joint_angle: 0.01
    scale_joint_vel: 0.1
    scale_linvel: 0.0
reward:
  scales:
    tracking_lin_vel: 2.0
    tracking_ang_vel: 1.5
    penalty_ang_vel_xy: -1.0
    penalty_orientation: -10.0
    penalty_action_rate: -4.0
    pose: -0.5
    penalty_feet_ori: -20.0
    feet_phase: 5.0
    alive: 10.0
    track_base_height_exp_smooth: 4.0
  tracking_sigma: 0.25
  base_height_target: 0.754
  min_base_height: 0.0
  max_tilt_deg: 180.0
  gait_frequency: 1.5
  feet_phase_swing_height: 0.09
  feet_phase_tracking_sigma: 0.04
  close_feet_threshold: 0.15
  pose_weights: [0.01, 1.0, 5.0, 0.01, 5.0, 5.0, 0.01, 1.0, 5.0, 0.01, 5.0, 5.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0]
teacher:
  algo_family: sac
  algo_type: sac
  algo_log_name: fast_sac
  task: sac/g1_walk_height/mujoco
  task_name: G1RecoveryCombined
  load_run: "-1"
  checkpoint: -1
  obs_dim: 99
  action_dim: 29
  actor_hidden_dim: 512
  use_layer_norm: true
  obs_normalization: true
student:
  obs_dim: 99
  action_dim: 29
  hidden_dims: [256, 256, 256]
  activation: elu
  squash_action: true
